[project]
name = "personal-assistant-ai"
version = "0.1.0"
description = "AI service for the personal assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
default-groups = ["dev"]
